# Runs the same checks as production (Vercel) before merge/deploy.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      # Optional: set in repo secrets if you want form URL validated in CI
      # NEXT_PUBLIC_FORM_ENDPOINT_URL: ${{ secrets.NEXT_PUBLIC_FORM_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
